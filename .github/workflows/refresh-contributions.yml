name: Refresh contributions

on:
  schedule:
    # 21:17 UTC daily — off the hour to avoid the cron rush.
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch GitHub + GitLab contributions
        env:
          GH_CONTRIBUTIONS_TOKEN: ${{ secrets.GH_CONTRIBUTIONS_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: npm run refresh-contributions

      - name: Commit when the data changed
        id: commit
        run: |
          if git diff --quiet -- src/data/contributions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/contributions.json
          git commit -m "chore: refresh contribution history"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The push above already triggers a rebuild for Workers Builds / Pages
      # connected to this repo. Set CF_DEPLOY_HOOK only if your project needs an
      # explicit trigger (Cloudflare deploy hooks accept an unauthenticated POST).
      - name: Trigger Cloudflare deploy
        if: steps.commit.outputs.changed == 'true' && secrets.CF_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "${{ secrets.CF_DEPLOY_HOOK }}"
